<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="24" fill="#00915a"/>
  <!-- BNP Paribas 4 flying stars/birds -->
  <g fill="#ffffff">
    <!-- Star/Bird 1 -->
    <path d="M 28 82 Q 33 68 46 64 Q 38 72 32 86 Z" />
    <!-- Star/Bird 2 -->
    <path d="M 45 62 Q 53 48 68 44 Q 58 54 50 67 Z" />
    <!-- Star/Bird 3 -->
    <path d="M 66 43 Q 76 30 92 26 Q 81 37 72 49 Z" />
    <!-- Star/Bird 4 (top flight) -->
