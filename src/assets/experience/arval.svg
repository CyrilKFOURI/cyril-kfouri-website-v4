  <!-- Wordmark ARVAL -->
  <text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">ARVAL</text>
</svg>
